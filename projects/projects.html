<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | rift4</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link
      rel="preload"
      href="../assets/fonts/NeueCometVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../style.css" />
    <script src="../assets/js/theme.js" defer></script>
  </head>
  <body data-theme="system">
    <header class="topbar">
      <a class="github-link" href="https://github.com/rift4" aria-label="GitHub profile">
        <img src="../assets/svgs/github.svg" alt="" />
      </a>
      <a class="home-link" href="../index.html" aria-label="Home">
        <span class="home-icon" aria-hidden="true"></span>
      </a>
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="System Mode"
        title="System Mode"
      >
        <img class="theme-icon theme-icon-system" src="../assets/icons/computer.svg" alt="" />
        <img class="theme-icon theme-icon-light" src="../assets/icons/light.svg" alt="" />
        <img class="theme-icon theme-icon-dark" src="../assets/icons/dark.svg" alt="" />
      </button>
    </header>
    <main>
      <section id="projects">
        <a class="project-card" href="https://github.com/rift4/rift4.github.io">
          <span class="project-card-title">rift4.github.io</span>
          <span class="project-card-description">this site</span>
          <span class="project-card-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="project-card" href="https://github.com/rift4/gfxdemo">
          <span class="project-card-title">gfxdemo</span>
          <span class="project-card-description">graphics demo for the terminal using C</span>
          <span class="project-card-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="project-card" href="https://github.com/rift4/Neue.Comet">
          <span class="project-card-title">Neue Comet</span>
          <span class="project-card-description">My personal fork of Inter</span>
          <span class="project-card-arrow" aria-hidden="true">↗</span>
        </a>
      </section>
    </main>
  </body>
</html>
