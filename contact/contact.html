<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | rift4</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link
      rel="preload"
      href="../assets/fonts/NeueCometVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../style.css" />
    <script src="../assets/js/theme.js" defer></script>
  </head>
  <body data-theme="system">
    <header class="topbar">
      <a class="github-link" href="https://github.com/rift4" aria-label="GitHub profile">
        <img src="../assets/svgs/github.svg" alt="" />
      </a>
      <a class="home-link" href="../index.html" aria-label="Home">
        <span class="home-icon" aria-hidden="true"></span>
      </a>
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="System Mode"
        title="System Mode"
      >
        <img class="theme-icon theme-icon-system" src="../assets/icons/computer.svg" alt="" />
        <img class="theme-icon theme-icon-light" src="../assets/icons/light.svg" alt="" />
        <img class="theme-icon theme-icon-dark" src="../assets/icons/dark.svg" alt="" />
      </button>
    </header>
    <main>
      <section id="contact">
        <div class="contact-entry">
          <img class="mail-icon" src="../assets/svgs/tuta-mail.svg" alt="" />
          mail: <a href="mailto:hello@rift4.dpdns.org">hello@rift4.dpdns.org</a>
        </div>
      </section>
    </main>
  </body>
</html>
