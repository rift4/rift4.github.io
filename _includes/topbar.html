<header class="topbar">
  <a class="github-link" href="https://github.com/rift4" aria-label="GitHub profile">
    <img src="{{ '/assets/svgs/github.svg' | relative_url }}" alt="" />
  </a>
  {% if include.show_home_link %}
    <a class="home-link" href="{{ include.home_url | relative_url }}" aria-label="Home">
      <span class="home-icon" aria-hidden="true"></span>
    </a>
  {% endif %}
  <button
    class="theme-toggle"
    id="theme-toggle"
    type="button"
    aria-label="System Mode"
    title="System Mode"
  >
    <img class="theme-icon theme-icon-system" src="{{ '/assets/icons/computer.svg' | relative_url }}" alt="" />
    <img class="theme-icon theme-icon-light" src="{{ '/assets/icons/light.svg' | relative_url }}" alt="" />
    <img class="theme-icon theme-icon-dark" src="{{ '/assets/icons/dark.svg' | relative_url }}" alt="" />
  </button>
</header>
